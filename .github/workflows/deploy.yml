name: Deploy Portfolio

on:
  push:
    branches: [master]
    paths:
      - 'portfolio-react/**'
      - 'maintenance/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Set to 'true' to serve maintenance/ instead of the portfolio build
env:
  MAINTENANCE_MODE: 'false'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: env.MAINTENANCE_MODE != 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portfolio-react/package-lock.json

      - name: Install dependencies
        if: env.MAINTENANCE_MODE != 'true'
        working-directory: portfolio-react
        run: npm ci

      - name: Build
        if: env.MAINTENANCE_MODE != 'true'
        working-directory: portfolio-react
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.MAINTENANCE_MODE == 'true' && 'maintenance' || 'portfolio-react/dist' }}

      - uses: actions/deploy-pages@v4
        id: deployment
