<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>syaqi.dev</title>
    <script>
      // GitHub Pages SPA redirect — encode the path into sessionStorage
      // so the main app can restore it after loading index.html
      var path = window.location.pathname;
      if (path !== '/') {
        sessionStorage.setItem('spa_redirect', path);
      }
      window.location.replace('/');
    </script>
  </head>
  <body></body>
</html>
