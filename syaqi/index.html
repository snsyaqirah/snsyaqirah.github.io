<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance | Syaqi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #202020;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #202020;
        }

        #maintenance-video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Fill the screen on all devices */
        }

        /* Optional: If video doesn't load, show fallback */
        .fallback {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            color: #e0e0e0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            text-align: center;
            display: none;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .fallback h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .fallback p {
            margin: 0.25rem 0;
        }

        video:not([src]) ~ .fallback {
            display: block;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video id="maintenance-video" autoplay muted loop playsinline>
            <source src="assets/img/01 - Under Maintenance.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="fallback">
            <h1>Under Maintenance</h1>
            <p>The site will be back... only God knows when</p>
            <p>— Syaqi</p>
        </div>
    </div>
</body>
</html>
